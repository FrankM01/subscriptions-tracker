name: subscriptions-tracker

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Copia .env.example a .env y configura las credenciales}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Configura POSTGRES_SUPERUSER_PASSWORD en .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:?Configura APP_DB_NAME en .env}
      APP_DB_USER: ${APP_DB_USER:?Configura APP_DB_USER en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configura APP_DB_PASSWORD en .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?Configura KEYCLOAK_DB_NAME en .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Configura KEYCLOAK_DB_USER en .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configura KEYCLOAK_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/09-init-databases.sh:ro
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SUBSCRIPTIONS_DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      SUBSCRIPTIONS_ENV: local
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-subscriptions}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-subscriptions-web}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://127.0.0.1:8081/realms/subscriptions}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/subscriptions/protocol/openid-connect/certs}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-subscriptions-api}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?Configura KEYCLOAK_DB_NAME en .env}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Configura KEYCLOAK_DB_USER en .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configura KEYCLOAK_DB_PASSWORD en .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Configura KEYCLOAK_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configura KEYCLOAK_ADMIN_PASSWORD en .env}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-subscriptions}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-subscriptions-web}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-subscriptions-api}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
